name: Release

# Building currently needs a Rust toolchain, which is a high bar for a tray utility that
# ships as one small executable. A version tag builds it here and attaches it instead.
on:
  push:
    tags: ["v*"]
  # So the workflow can be exercised without minting a tag. It builds and checks, and
  # stops short of creating anything.
  workflow_dispatch:

permissions:
  contents: write
  # For the attestation below. `id-token` is what signs it, `attestations` is what
  # records it against the repository.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          rustup show
          cargo -V

      # Deliberately no cache. A release is built rarely and has to be reproducible from
      # the tag alone, so a stale target directory is not a risk worth taking to save a
      # minute.
      # --locked because a release has to be the dependency set that was committed. Without
      # it a Cargo.toml the lock file does not match would be resolved here, and the exe
      # people download would be built from versions nobody chose.
      - name: Build
        run: cargo build --locked --release

      # The tag is what people will quote, and the tray menu shows CARGO_PKG_VERSION. If
      # the two disagree, whichever one someone reads is wrong.
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        # The ref arrives as an environment variable rather than through ${{ }}. A tag name
        # may contain a semicolon, and expanding one into the script body would run it.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:REF_NAME
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw 'no version in Cargo.toml' }
          $version = $line.Matches[0].Groups[1].Value
          "tag $tag, Cargo.toml $version"
          if ($tag -ne "v$version") { throw "tag $tag does not match Cargo.toml version $version" }

      - name: Test
        run: cargo test --locked

      - name: Binary size
        shell: pwsh
        run: ./.github/check-size.ps1

      - name: Stage the asset
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The ref becomes part of a file name, and a branch name may contain a slash:
          # `feature/foo` would name a directory that does not exist and fail the copy.
          # `v0.1.0` and `v0.1.0-rc.1` come through whole, because a leading v, digits,
          # dots and hyphens are all in the set kept below. A tag using anything else, such
          # as semver build metadata (`v0.1.0+2026`), gets a dash where that character was.
          # Only the file on disk differs: the release is still named by the tag, and the
          # checksum beside it is written from the file.
          $suffix = $env:REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = "dist/inzone-h9-gen1-headset-status-$suffix.exe"
          Copy-Item target/release/inzone-h9-gen1-headset-status.exe $asset
          Add-Content -Path $env:GITHUB_ENV -Value "asset=$asset"

      # NSIS is on the runner image, so this needs no setup step of its own. The full path
      # rather than the bare name: PATH is the image's business and this is not worth being
      # at the mercy of.
      #
      # The installer is not the main way to get this app, and the portable exe above stays.
      # It exists because the startup entry holds a full path, and a versioned file name
      # moves that path at every release. See packaging/installer.nsi.
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "makensis not found at $nsis" }
          # From Cargo.toml, not from the tag: this step also runs on workflow_dispatch,
          # where the ref is a branch name and would end up in the Programs list.
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw 'no version in Cargo.toml' }
          $version = $line.Matches[0].Groups[1].Value
          $setup = $env:asset -replace '\.exe$', '-setup.exe'
          # Absolute, both of them. NSIS resolves a relative path against its own working
          # directory rather than against the script, and getting that wrong writes the
          # installer somewhere nothing looks for it.
          $source = (Resolve-Path target/release/inzone-h9-gen1-headset-status.exe).Path
          $out = Join-Path (Get-Location).Path $setup
          & $nsis -V2 "-DVERSION=$version" "-DSOURCE_EXE=$source" "-DOUT_FILE=$out" packaging/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          "$((Get-Item $setup).Length) bytes  $setup"
          Add-Content -Path $env:GITHUB_ENV -Value "setup=$setup"

      # Both files, in one place. An unsigned exe off the internet deserves something to
      # check it against, and the installer is the one most people will actually run. Writing
      # the two sidecars in the steps that produce each file would be the obvious shape, and
      # it is how the algorithm in one of them drifts away from the other.
      - name: Checksum the assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in $env:asset, $env:setup) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            # The bare file name, not the path: it is what the reader has on disk.
            "$hash  $(Split-Path -Leaf $file)" | Set-Content -NoNewline "$file.sha256"
            "$hash  $file"
          }

      # Says that this exact file came out of this workflow, at this commit. The checksum
      # beside the asset only proves the download is intact; this is what a stranger can
      # check the origin against, with:
      #
      #   gh attestation verify inzone-h9-gen1-headset-status-<version>.exe -R ugai/inzone-h9-gen1-headset-status
      #
      # Before the release, so a signature that could not be recorded stops the run while
      # there is still nothing published. Keyed on the event for the same reason the draft
      # below is: an attestation is a record against the repository, and a manual run
      # promises to create nothing.
      #
      # Free on public repositories, on every plan. On a private or internal one it needs
      # GitHub Enterprise Cloud, and this step is where a private repository fails.
      - name: Attest the build
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          # Both assets. The installer is the file most people will run, so leaving it out
          # would attest the one nobody double-clicks.
          subject-path: |
            ${{ env.asset }}
            ${{ env.setup }}

      # Created as a draft: pushing a tag says "build this", and publishing is a separate
      # decision. Review the notes and press the button, or drop --draft here to skip that.
      #
      # Keyed on the event, not on the ref. The only push this workflow answers is a v* tag,
      # so `push` means a tag; `startsWith(github.ref, 'refs/tags/')` was also true of a
      # manual run launched from a tag, which would have minted a release from a button the
      # comment at the top of this file promises creates nothing.
      - name: Draft the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create "${env:REF_NAME}" `
            "${env:asset}" "${env:asset}.sha256" `
            "${env:setup}" "${env:setup}.sha256" `
            --draft `
            --generate-notes `
            --title "${env:REF_NAME}"

      # workflow_dispatch has no release to attach to, so the build is still inspectable.
      # The condition mirrors the one above: between them every run produces exactly one of
      # the two, including a manual run launched from a tag.
      - name: Upload the build instead
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: inzone-h9-gen1-headset-status
          path: dist/
